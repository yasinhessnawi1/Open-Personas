<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Open Persona — AI personas with real memory, real autonomy, and a real voice">
  <style>
    .bg { fill: #faf7f2; }
    .fg { fill: #2b241d; }
    .sub { fill: #6b6257; }
    .edge { stroke: #2b241d; stroke-opacity: 0.14; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #16130f; }
      .fg { fill: #f2ede5; }
      .sub { fill: #a89e91; }
      .edge { stroke: #f2ede5; stroke-opacity: 0.16; }
    }
    .wordmark { font: 700 64px/1 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -1.5px; }
    .tagline { font: 400 21px/1 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.2px; }
    .storelabel { font: 600 12px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 1.5px; }
  </style>

  <rect class="bg" width="1200" height="300"/>

  <!-- knowledge-graph constellation (right side): vermilion core + the four typed-store hues -->
  <g>
    <line class="edge" x1="985" y1="150" x2="880" y2="78"  stroke-width="1.5"/>
    <line class="edge" x1="985" y1="150" x2="1105" y2="95" stroke-width="1.5"/>
    <line class="edge" x1="985" y1="150" x2="900" y2="228" stroke-width="1.5"/>
    <line class="edge" x1="985" y1="150" x2="1115" y2="212" stroke-width="1.5"/>
    <line class="edge" x1="880" y1="78"  x2="1105" y2="95" stroke-width="1"/>
    <line class="edge" x1="900" y1="228" x2="1115" y2="212" stroke-width="1"/>
    <line class="edge" x1="880" y1="78"  x2="790" y2="140" stroke-width="1"/>
    <line class="edge" x1="900" y1="228" x2="790" y2="140" stroke-width="1"/>

    <circle cx="790"  cy="140" r="5"  fill="#a89e91" opacity="0.7"/>
    <circle cx="880"  cy="78"  r="11" fill="#2ba193"/>
    <circle cx="1105" cy="95"  r="11" fill="#5ba350"/>
    <circle cx="900"  cy="228" r="11" fill="#8283e0"/>
    <circle cx="1115" cy="212" r="11" fill="#d879ae"/>
    <circle cx="985"  cy="150" r="16" fill="#e2532f"/>
    <circle cx="985"  cy="150" r="24" fill="none" stroke="#e2532f" stroke-opacity="0.35" stroke-width="2"/>

    <text class="storelabel" x="862" y="56"  fill="#2ba193" text-anchor="middle">IDENTITY</text>
    <text class="storelabel" x="1105" y="73" fill="#5ba350" text-anchor="middle">SELF-FACTS</text>
    <text class="storelabel" x="898" y="258" fill="#8283e0" text-anchor="middle">WORLDVIEW</text>
    <text class="storelabel" x="1115" y="242" fill="#d879ae" text-anchor="middle">EPISODIC</text>
  </g>

  <!-- wordmark -->
  <text class="fg wordmark" x="80" y="150">Open Persona</text>
  <text class="sub tagline" x="82" y="196">AI personas with real memory, real autonomy, and a real voice.</text>
</svg>
