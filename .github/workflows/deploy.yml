name: Deploy

# Auto-deploy persona-api, persona-voice AND the self-hosted LiveKit SFU to Fly.
# Fires only for a green CI run on a PUSH to `main` in THIS repository, or for a
# manual run started from `main`. Never on a pull request, never on a red build.
#
# Why every job checks the event and the repository, not just the branch name:
# this workflow runs on `workflow_run`, in the base repository, with the production
# secrets, and checks out the head commit of the CI run that triggered it. CI also
# runs on `pull_request`, using the pull request's own ci.yml. A pull request from a
# FORK's `main` branch therefore produced a green CI run whose head_branch is
# `main`, and a gate on the branch name alone deployed the fork's commit with the
# org-scoped FLY_API_TOKEN. `event == 'push'` and `head_repository.full_name ==
# github.repository` close that. The workflow token is read-only
# (`permissions: contents: read`); nothing here writes to the repository.
# packages/api/tests/unit/test_deploy_fork_gate.py fails CI if any job loses these.
# Do not re-run a Deploy run created before this fix: a re-run uses that run's
# original copy of this file, with the old gate.
#
# Every action is pinned to a full commit SHA, not a branch or a tag, and every
# checkout drops its token after checking out (persist-credentials: false).
# setup-flyctl downloads the flyctl release WITHOUT verifying a checksum; what
# stands in for that is that both the action (commit) and flyctl (version) are
# pinned. A job that holds a secret may carry only the keys and the exact steps
# scripts/check_deploy_wiring.py allows: no container, services, env,
# permissions, outputs or strategy, and runs-on is ubuntu-latest.
#
# Vercel handles persona-web deploys via its
# own GitHub integration; open-persona-db (self-hosted Postgres) is deployed once
# out-of-band, not here. open-persona-livekit's app + dedicated IPv4 + LIVEKIT_KEYS
# secret are provisioned once out-of-band; this workflow only redeploys its image.
#
# One-time setup:
#   1. Generate a deploy-scoped Fly token. The api job and the voice job both
#      read `secrets.FLY_API_TOKEN`, so it MUST be authorised for BOTH apps.
#      An app-scoped token (`-a open-persona-api`) CANNOT deploy voice and the
#      voice job will 401. Create an ORG-scoped deploy token instead:
#        flyctl tokens create deploy -x 2160h
#      (no `-a` flag → scoped to the org, usable for every app in it). 2160h =
#      90-day expiry. Copy the full `FlyV1 …` value it prints.
#   2. The token is an ENVIRONMENT secret of `production` (step 4), never a
#      repository secret: a repository secret is readable by a run from any branch.
#   3. (Optional) Re-deploy by hand from the Actions tab without pushing a commit.
#      From `main` only: every job's `if` refuses another ref, and the Environment's
#      branch rule (step 4a) refuses it the secrets even with an edited workflow.
#   4. The settings the api and voice share (R9-213). Do these in order.
#      a. The `Production` Environment already exists (since 2026-05-30, with no
#         rules and no secrets); GitHub matches `environment: production` to it
#         regardless of case. Settings > Environments > Production > Deployment
#         branches and tags: choose "Selected branches and tags", add `main`, and
#         confirm `main` is the ONLY rule listed.
#      b. Add eight ENVIRONMENT secrets there. FLY_API_TOKEN: a fresh token from
#         step 1 (`flyctl tokens create deploy -x 2160h`), never stored at
#         repository level. And the seven settings, named like the runtime ones:
#           PERSONA_FRONTIER_MODELS, PERSONA_MID_MODELS, PERSONA_SMALL_MODELS,
#           PERSONA_FREE_FRONTIER_MODELS, PERSONA_FREE_MID_MODELS,
#           PERSONA_FREE_SMALL_MODELS, PERSONA_OPENROUTER_SUBSCRIPTION_MODE.
#         Chains are comma-separated provider/model entries (no quotes, spaces or
#         newlines); the mode is exactly `free` or `paid`.
#      c. Merge and push this workflow. Until then, main's jobs declare no
#         environment and cannot read Environment secrets, so merging it is what
#         restores deploys on the new token.
#      d. After the first green Deploy run: delete the repository-level
#         FLY_API_TOKEN (Settings > Secrets and variables > Actions, Repository
#         secrets), confirm it is gone, and revoke the token that was stored there
#         (`flyctl tokens list`, then `flyctl tokens revoke <id>`).
#      How it runs: validate-model-chains checks all seven before anything is
#      written, in a job that never holds the Fly token; stage-model-chains, a
#      separate job with nothing in it but checkout, flyctl and a
#      standard-library script, then stages them on BOTH apps.
#      verify-model-chains then fails the run unless both apps hold the same seven
#      values, Deployed; it runs even when one deploy failed, so a split still
#      reports itself. To change a setting: update the secret, then run this
#      workflow. Never `flyctl secrets set` these seven by hand: the next deploy
#      puts the shared value back.
#      A partial stage: if staging succeeds on the api and then fails on voice, the
#      job fails and nothing deploys, but the api keeps the new values STAGED. They
#      go live on the api's next deploy, a hand-run `flyctl deploy` included, so do
#      not deploy the api by hand until a Deploy run has passed again; the next run
#      stages both apps again and converges them.
#
# The whole workflow is one concurrency group: a second run waits for the first to
# finish rather than racing it, and nothing in progress is cancelled. Jobs carry no
# groups of their own.

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  # Allow manual re-deploy from the Actions tab without a code change. Accepted
  # from `main` only: a manual run uses the chosen branch's copy of this file.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  validate-model-chains:
    # R9-213: the six model chains and the OpenRouter subscription mode, from the
    # production Environment's secrets (setup step 4), checked before anything is
    # written. This job imports the runtime and its third-party dependencies, and
    # `uv sync` builds the workspace packages with a build backend uv.lock does not
    # pin, so it never holds the Fly token: on a runner the job, not the step, is
    # the boundary. A missing or bad value fails it, nothing is staged or deployed,
    # and each app keeps what it has.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout the commit CI verified
        # actions/checkout tag v4.4.0 (= v4), commit of 2026-07-16.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      # astral-sh/setup-uv tag v10.2.0, commit of 2026-09-21.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          # uv itself, pinned: the latest release on 2026-09-25. No cache: this job
          # holds production secrets and restores nothing it did not build itself.
          version: "0.12.19"
          enable-cache: false

      # Only what the validator imports: persona-runtime and its persona-core
      # dependency, at the versions uv.lock pins. uv.lock does not pin the build
      # backend that builds the workspace packages themselves.
      - run: uv sync --frozen --no-dev --package persona-runtime

      # The values reach this step only as step env, never as secrets expressions
      # inside a run block, and nothing here traces commands.
      - name: Validate the seven settings (no Fly token, writes nothing)
        env:
          PERSONA_FRONTIER_MODELS: ${{ secrets.PERSONA_FRONTIER_MODELS }}
          PERSONA_MID_MODELS: ${{ secrets.PERSONA_MID_MODELS }}
          PERSONA_SMALL_MODELS: ${{ secrets.PERSONA_SMALL_MODELS }}
          PERSONA_FREE_FRONTIER_MODELS: ${{ secrets.PERSONA_FREE_FRONTIER_MODELS }}
          PERSONA_FREE_MID_MODELS: ${{ secrets.PERSONA_FREE_MID_MODELS }}
          PERSONA_FREE_SMALL_MODELS: ${{ secrets.PERSONA_FREE_SMALL_MODELS }}
          PERSONA_OPENROUTER_SUBSCRIPTION_MODE: ${{ secrets.PERSONA_OPENROUTER_SUBSCRIPTION_MODE }}
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/validate_deploy_chains.py

  stage-model-chains:
    # R9-213: stage the seven validated settings on BOTH apps before either
    # deploys. This job holds the Fly token, so it runs nothing but checkout, the
    # pinned flyctl setup and a standard-library-only script under `python3 -I`,
    # which gives the token to flyctl's own process and the values to flyctl on
    # stdin. No uv, no pip, no Python setup: scripts/check_deploy_wiring.py holds
    # the exact list of steps allowed here.
    needs: validate-model-chains
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout the commit CI verified
        # actions/checkout tag v4.4.0 (= v4), commit of 2026-07-16.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      # superfly/flyctl-actions tag 1.6 (= v1 and master), commit of 2026-04-08.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          # flyctl itself, pinned too: the latest release on 2026-09-25 (published
          # 2026-09-24). Bump it deliberately; `latest` would download whatever
          # release exists on the day of the deploy.
          version: 0.4.108

      - name: Stage the seven settings on api and voice
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          PERSONA_FRONTIER_MODELS: ${{ secrets.PERSONA_FRONTIER_MODELS }}
          PERSONA_MID_MODELS: ${{ secrets.PERSONA_MID_MODELS }}
          PERSONA_SMALL_MODELS: ${{ secrets.PERSONA_SMALL_MODELS }}
          PERSONA_FREE_FRONTIER_MODELS: ${{ secrets.PERSONA_FREE_FRONTIER_MODELS }}
          PERSONA_FREE_MID_MODELS: ${{ secrets.PERSONA_FREE_MID_MODELS }}
          PERSONA_FREE_SMALL_MODELS: ${{ secrets.PERSONA_FREE_SMALL_MODELS }}
          PERSONA_OPENROUTER_SUBSCRIPTION_MODE: ${{ secrets.PERSONA_OPENROUTER_SUBSCRIPTION_MODE }}
        run: |
          set -euo pipefail
          python3 -I scripts/fly_deploy_chains.py stage open-persona-api open-persona-voice

  deploy-api:
    # Only for a green CI run on a push to main in this repository, or a manual
    # run from main (github.event.workflow_run is null then). See the header.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    # R9-213: never deploy without the shared settings staged on both apps.
    needs: stage-model-chains
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout the commit CI verified
        # actions/checkout tag v4.4.0 (= v4), commit of 2026-07-16.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # When triggered by workflow_run, default checkout would be the
          # default branch tip; pin to the exact SHA that just passed CI so a
          # deploy can never race ahead of its checks.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      # superfly/flyctl-actions tag 1.6 (= v1 and master), commit of 2026-04-08.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          # flyctl itself, pinned too: the latest release on 2026-09-25 (published
          # 2026-09-24). Bump it deliberately; `latest` would download whatever
          # release exists on the day of the deploy.
          version: 0.4.108

      # Remote build — Fly's builders are tuned for this and CI runners don't
      # need to pay the local Docker disk cost. `.dockerignore` keeps the
      # build context tiny (~5 MB) so the upload to Fly's builder is fast.
      #
      # fly.toml lives at ``packages/api/fly.toml`` (next to the Dockerfile),
      # tracked in git. The earlier ``deploy/fly.toml`` location was excluded
      # by the ``deploy/*`` gitignore rule and so was absent on CI runners —
      # flyctl logged ``Validating --config path unset--`` and then failed
      # the build with a phantom dockerfile path. Co-locating fly.toml with
      # the Dockerfile lets flyctl resolve ``dockerfile = "Dockerfile"``
      # naturally (relative to fly.toml's directory). $WORKSPACE
      # (= ``github.workspace``, system-provided) makes the ``--config`` path
      # absolute, and the workflow's CWD is the repo root (default) so the
      # build daemon receives the full workspace tree as build context — the
      # Dockerfile's ``COPY packages/<member>/...`` paths require that.
      - name: flyctl deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          flyctl deploy \
            --remote-only \
            --config "$WORKSPACE/packages/api/fly.toml" \
            --app open-persona-api \
            --strategy rolling \
            --wait-timeout 600

      - name: Smoke-test /healthz
        run: |
          # Give the new machine a moment to settle, then verify the public URL.
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 https://api.openpersona.online/healthz | grep -q '"status":"ok"'; then
              echo "healthz ok"
              exit 0
            fi
            echo "waiting for healthz to flip green ($i/6)…"
            sleep 10
          done
          echo "::error::healthz did not flip green within 60s after deploy"
          exit 1

  deploy-voice:
    # Same gate as deploy-api: a green CI run on a push to main in this
    # repository, or a manual run from main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    # R9-213: never deploy without the shared settings staged on both apps.
    needs: stage-model-chains
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout the commit CI verified
        # actions/checkout tag v4.4.0 (= v4), commit of 2026-07-16.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Pin to the exact SHA that just passed CI (same reasoning as the api
          # job) so a deploy can never race ahead of its checks.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      # superfly/flyctl-actions tag 1.6 (= v1 and master), commit of 2026-04-08.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          # flyctl itself, pinned too: the latest release on 2026-09-25 (published
          # 2026-09-24). Bump it deliberately; `latest` would download whatever
          # release exists on the day of the deploy.
          version: 0.4.108

      # Remote build from the repo root (default CWD) so the build daemon gets
      # the full workspace tree — the voice Dockerfile's `COPY packages/<member>/`
      # paths require the repo root as build context. fly.toml lives at
      # packages/voice/fly.toml (next to the Dockerfile); $WORKSPACE makes the
      # --config path absolute.
      #
      # NOTE on FLY_API_TOKEN: this reuses the same secret as deploy-api, so the
      # token MUST be org-scoped (or at least authorised for open-persona-voice).
      # An api-app-scoped token 401s here. See the one-time-setup header.
      #
      # --wait-timeout is deliberately generous (900s). Voice cold start loads
      # the bge-small embedder + Silero VAD on CPU BEFORE the uvicorn listener
      # binds; on a shared VM that is minutes, not seconds (fly.toml's TCP check
      # grace_period is 300s). flyctl waits on that TCP health check to pass, so
      # the wait must comfortably exceed the worst-case cold start.
      - name: flyctl deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          flyctl deploy \
            --remote-only \
            --config "$WORKSPACE/packages/voice/fly.toml" \
            --app open-persona-voice \
            --strategy rolling \
            --wait-timeout 900

      # No public /healthz curl: voice's only HTTP routes are auth-gated (they
      # 401 unauthenticated), so there is no anonymous health probe. The
      # `flyctl deploy --wait-timeout` above already blocks until the machine's
      # TCP health check passes, so a successful deploy is itself the success
      # signal. This step is a non-fatal sanity confirmation that flyctl agrees
      # the machine is up, via `flyctl status` (no HTTP probe invented).
      - name: Confirm machine status
        if: success()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl status --app open-persona-voice

  verify-model-chains:
    # R9-213: after both app deploys, the seven shared settings must be on both
    # apps, Deployed, with the same value. It runs even when one deploy failed
    # (`!cancelled()`), provided the stage succeeded, so a split still reports
    # itself. It prints match, differs, missing or not deployed per setting and
    # app, never a digest: this repository's Actions log is public.
    needs: [stage-model-chains, deploy-api, deploy-voice]
    if: >-
      (!cancelled() && needs.stage-model-chains.result == 'success' &&
       github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (!cancelled() && needs.stage-model-chains.result == 'success' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout the commit CI verified
        # actions/checkout tag v4.4.0 (= v4), commit of 2026-07-16.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      # superfly/flyctl-actions tag 1.6 (= v1 and master), commit of 2026-04-08.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          # flyctl itself, pinned too: the latest release on 2026-09-25 (published
          # 2026-09-24). Bump it deliberately; `latest` would download whatever
          # release exists on the day of the deploy.
          version: 0.4.108

      - name: The seven settings match and are deployed on api and voice
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 -I scripts/fly_deploy_chains.py verify open-persona-api open-persona-voice


  # deploy-connectors was removed on 2026-09-09. Since the connectors fold, the six
  # chat transports run INSIDE the api process (PERSONA_API_EMBED_CONNECTORS on
  # open-persona-api) and the standalone open-persona-connectors app is kept defined
  # at zero machines only as the rollback path for two weeks. Deploying it from here
  # re-created its machines under the flipped api and put three Telegram pollers,
  # two Slack sockets and two Discord gateways on one set of credentials (double
  # delivery; the runbook's one hazard). If the rollback is ever needed, scale that
  # app by hand: flyctl scale count 1 -a open-persona-connectors. Do not add the job
  # back.

  deploy-livekit:
    # Same gate as the other jobs: a green CI run on a push to main in this
    # repository, or a manual run from main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout the commit CI verified
        # actions/checkout tag v4.4.0 (= v4), commit of 2026-07-16.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      # superfly/flyctl-actions tag 1.6 (= v1 and master), commit of 2026-04-08.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          # flyctl itself, pinned too: the latest release on 2026-09-25 (published
          # 2026-09-24). Bump it deliberately; `latest` would download whatever
          # release exists on the day of the deploy.
          version: 0.4.108

      # DIFFERENT build context from api/voice: the LiveKit Dockerfile COPYs its
      # OWN files (entrypoint.sh, livekit.yaml) with relative paths — NOT repo-root
      # `COPY packages/<member>/...`. So the build context must be packages/livekit/,
      # not the repo root. `working-directory` makes that the CWD, and the build
      # daemon receives that dir as context (fly.toml is read from the CWD).
      #
      # FLY_API_TOKEN must be org-scoped (same as the other jobs). The SFU starts
      # fast (thin livekit-server image, no embedder), so a short wait suffices.
      # The app/IPv4/LIVEKIT_KEYS are provisioned out-of-band; this only ships the
      # image.
      - name: flyctl deploy
        working-directory: packages/livekit
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --remote-only \
            --config fly.toml \
            --app open-persona-livekit \
            --strategy rolling \
            --wait-timeout 300

      # Unlike voice, LiveKit serves an anonymous HTTP endpoint (Fly 443 → 7880),
      # so signaling reachability is directly probe-able — a real post-deploy check.
      - name: Smoke-test signaling
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 https://open-persona-livekit.fly.dev/ >/dev/null; then
              echo "livekit signaling reachable"
              exit 0
            fi
            echo "waiting for livekit signaling ($i/6)…"
            sleep 10
          done
          echo "::error::livekit signaling did not respond within 60s after deploy"
          exit 1
