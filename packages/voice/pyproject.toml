[project]
name = "persona-voice"
version = "1.2.1"
description = "Real-time voice service for persona-core — WebRTC transport via LiveKit OSS Server."
readme = "README.md"
requires-python = ">=3.11"
# MIT — the open-source engine (Spec 33). Free for any use, including
# commercial. The application layer (persona-api / persona-web) is separately
# licensed PolyForm-Noncommercial-1.0.0 (source-available, noncommercial).
license = "MIT"
# The bundled Silero model is MIT too (Silero Team); its notice ships with the wheel.
license-files = ["LICENSE", "src/persona_voice/stt/data/SILERO_VAD_LICENSE"]
authors = [
    { name = "Yasin Hessnawi", email = "yasinhessnawi1@gmail.com" },
]
keywords = [
    "ai",
    "persona",
    "voice",
    "webrtc",
    "livekit",
    "stt",
    "tts",
    "real-time",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    # persona-core direct store access (D-V1-4) + the extracted JWT verifier
    # surface (D-V1-X-jwt-verifier-extraction lands at T03 inside persona-core).
    # Lower-bounded for the same reason persona-runtime bounds it (published wheels
    # build with `uv build --no-sources`, so an unbounded sibling can resolve stale).
    "persona-core[postgres]>=1.2.1,<2",
    # Spec V5 (D-V5-6): the integration thread composes persona-runtime's
    # PromptBuilder / Router / TierRegistry / FirstTokenLatencyTracker into the
    # voice turn so the voice persona is conditioned EXACTLY as the text persona
    # (no persona-bypass). The one structural dep edge V1 deliberately omitted —
    # the layering stays acyclic (voice → runtime → core); persona-runtime never
    # imports persona-voice. Internal workspace package, no new external dep.
    "persona-runtime>=1.2.1,<2",
    # LiveKit OSS substrate per D-V1-1 (branch (A) lock 2026-06-07). The PyPI
    # name is `livekit` (NOT `livekit-rtc` — decisions.md / tasks.md used the
    # historical alias). v1.1.10 is the Python Room / Participant / Track SDK;
    # Apache-2.0 per D-V1-X-livekit-sdk-license-stack. Transitive surface:
    # protobuf + types-protobuf + aiofiles + numpy — all permissive.
    "livekit>=1.1,<2",
    # LiveKit server-side AccessToken issuance per D-V1-3 — T04's
    # `POST /v1/voice/token` endpoint signs LiveKit JWTs with the API secret.
    # PyPI name is `livekit-api` (NOT `livekit-server-sdk-python`); v1.1.0.
    "livekit-api>=1.1,<2",
    # Deepgram streaming-STT SDK per Spec V2 D-V2-1 LOCK launch provider
    # (R-V2-1 audit: MIT-licensed; PEP 561 typed; transitive deps
    # `httpx` BSD-3 / `websockets` BSD-3 / `aiohttp` Apache-2.0 / `pydantic` MIT
    # / `dataclasses-json` MIT — all permissive per
    # D-V1-X-livekit-sdk-license-stack precedent). Used only inside
    # `persona_voice.stt.deepgram_backend` per Spec 02 ChatBackend
    # adapter-boundary discipline.
    "deepgram-sdk>=4.0,<5",
    # Silero VAD ONNX-only path per Spec V2 D-V2-X-silero-implementation-shape
    # LOCK (ONNX-only + SileroFramer mandatory + lazy-construct + explicit prewarm),
    # no torch. The Silero v5.1 model ships inside this package
    # (src/persona_voice/stt/data/silero_vad.onnx, MIT, Silero Team, sha256-pinned)
    # and runs on onnxruntime (persona_voice.stt.silero_onnx), which publishes wheels
    # for Linux x86_64 and aarch64, macOS arm64 and Windows. It replaced
    # silero-vad-lite 0.3.0, which wrapped the same model in C++ but had no Linux
    # aarch64 wheel and whose source build downloads an x86_64 ONNX Runtime; the
    # equivalence test holds the scores to it. onnxruntime was already in the tree
    # (chromadb), so this adds no new package. MIT. The floor is the version the
    # equivalence gate measured (1.26); it has wheels for every platform voice supports.
    "onnxruntime>=1.26,<2",
    "cartesia[websockets]>=3,<4",
]

[project.urls]
Homepage = "https://github.com/yasinhessnawi1/Open-Personas-ai"
Repository = "https://github.com/yasinhessnawi1/Open-Personas-ai"
Issues = "https://github.com/yasinhessnawi1/Open-Personas-ai/issues"
Changelog = "https://github.com/yasinhessnawi1/Open-Personas-ai/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/persona_voice"]
include = [
    "src/persona_voice/py.typed",
]

[tool.uv.sources]
persona-core = { workspace = true }
persona-runtime = { workspace = true }
