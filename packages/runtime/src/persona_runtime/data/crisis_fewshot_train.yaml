# R6 crisis-detection-encoder FEW-SHOT TRAINING set (Spec R6, R6-D-1 / R6-D-4).
#
# The labelled few-shot set the encoder head (LogReg over the FROZEN
# `paraphrase-multilingual-MiniLM-L12-v2` body) is fitted on at load. SetFit's finding
# (≈8 examples/class ≈ RoBERTa-Large on 3k) is what lets this be small — a few dozen
# authored examples per class, no large sensitive corpus (R6-D-1; the reason V11
# deferred R2).
#
# ── SENSITIVE-DATA POLICY (R6-D-4, STRICT) ──────────────────────────────────────────
#   SYNTHETIC / AUTHORED only. NO real crisis text vendored. No line copied from any
#   person, forum, transcript, or gated corpus.
#
# ── HELD-OUT / DISJOINTNESS ──────────────────────────────────────────────────────────
#   Every text here is DISJOINT from the EVAL suite (`tests/fixtures/
#   crisis_encoder_probes.yaml`) — DELIBERATELY DIFFERENT phrasings, so T5 measures the
#   encoder's GENERALISATION, not memorisation. Enforced by
#   `test_crisis_encoder.py::test_eval_and_train_sets_are_disjoint` (a test, not a
#   convention): a probe that appears in both fails the build.
#
# ── LABELS ──────────────────────────────────────────────────────────────────────────
#   label: crisis  → positive (the head learns "route to the wellbeing path")
#   label: benign  → negative (incl. ADJACENT hard negatives — tired / mildly sad /
#     figurative kill·dead — so the head learns precision, holding the FP ceiling)
#   Positives span the six covered non-English languages + English (explicit + indirect)
#   so the multilingual recall is trained, not just English.
examples:
  # ============================ POSITIVES (crisis) ============================
  # --- English, indirect / euphemistic (distinct from eval phrasings) ---
