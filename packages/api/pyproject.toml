[project]
name = "persona-api"
version = "1.0.0"
description = "Hosted FastAPI service for Persona"
requires-python = ">=3.11"
# Source-available, noncommercial use only. NOT OSI-approved (Spec 33). See
# LICENSE for full terms; commercial use requires a separate license from the
# rights holder. The engine (persona-core / persona-runtime / persona-voice) is
# separately MIT-licensed.
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
dependencies = [
    "persona-core[postgres]",
    "persona-runtime",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "alembic>=1.13,<2",
    "python-jose[cryptography]>=3.3,<4",
    # Spec 13 T10b — Pillow for image downscale + EXIF strip.
    # ``persona-api``-only per D-13-X-pillow (HPND license; ``persona-core``
    # stays Apache-2.0 clean). Used by services/image_service::_maybe_downscale.
    "pillow>=11,<12",
    # Spec 12 T08/T09 — HostedSandbox (E2B Code Interpreter SDK, D-12-12
    # substrate) backs the production `code_execution` tool. DIRECT dep, not an
    # optional extra: persona-api is the hosted service, the only thing that
    # installs it is the Fly deploy, and that deploy selects the E2B backend
    # whenever E2B_API_KEY is set (app.py `_e2b_api_key_present()`). The prod
    # Dockerfile's `uv sync --all-packages --no-dev` installs direct deps but
    # NOT optional extras — so as an extra the SDK was never installed in prod,
    # and code_execution failed with SandboxUnavailableError(reason=sdk_missing).
    # Still lazy-imported at the use-site, so dev/no-key environments boot
    # cleanly with the tool simply absent (D-12-5 no degraded fallback).
    "e2b-code-interpreter>=1.0,<2",
    # Spec 30 T07 (D-30-4) — Fernet/MultiFernet for bring-your-own MCP
    # credential encryption-at-rest. Promoted from a transitive of
    # python-jose[cryptography] to a DIRECT dep (we use it directly now);
    # already resolved in uv.lock, so this pulls nothing new.
    "cryptography>=43,<49",
    # Spec K10 (T1, D-K10-1) — the community edition's INVISIBLE managed-Postgres
    # substrate: a pip-bundled Postgres 16 + pgvector with no root/Docker/system
    # install, run rootless over a unix socket (no TCP listener → no port
    # conflicts). Apache-2.0; actively maintained by Pixeltable, which runs it in
    # production; bundles pgvector 0.8.1 (Phase-2 spike verified PG 16.11 + the
    # full 38-migration chain + a real graph write/read + cold-restart durability).
    # Lazy-imported only on the embedded community path (db/community_managed.py);
    # cloud + legacy-sqlite + external-DSN boots never touch it.
    "pixeltable-pgserver==0.5.1",
]

# Portable console entrypoint — `uv run persona-api` / `python -m persona_api`.
# Cross-platform launcher for self-hosters; loads .env and serves the app
# factory via uvicorn. `run-local.sh` remains the owner's cloud dev harness.
[project.scripts]
persona-api = "persona_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/persona_api"]

[tool.uv.sources]
persona-core = { workspace = true }
persona-runtime = { workspace = true }
