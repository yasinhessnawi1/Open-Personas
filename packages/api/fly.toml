# Open Persona — persona-api Fly.io app config (Spec 11, T10).
# Companion walkthrough: deploy/FLY_DEPLOY.md
#
# Single Machine, single uvicorn worker (S08-4 / D-08-5). Kept single for now —
# NOT autoscaled, NOT autostopped — see the scale-readiness note below.
#
# SCALE-READINESS (Spec R5, R5-D-6). R5 lifted the single-worker assumption for
# the subsystems where it was a correctness bug, so these are now multi-worker /
# multi-instance SAFE:
#   - Audit (store-mutation + tool): PERSONA_API_AUDIT_BACKEND=postgres routes to
#     the store_audit_events / tool_audit_events tables (was single-writer JSONL).
#   - Request telemetry: RequestTelemetryMiddleware → the shared request_telemetry
#     table (§6.3), aggregated across workers.
#   - Artifacts / uploads / images: PERSONA_API_STORAGE_BACKEND=s3 (Tigris) lifts
#     the Fly-volume host/region pin so bytes aren't machine-local.
# STILL REQUIRED before raising min_machines_running > 1 (documented-OUT of R5):
#   - The in-process agentic-run / chat SSE event bus (background/run_worker.py) is
#     machine-local — a client reconnecting to a different Machine loses the live
#     stream. Needs sticky sessions or LISTEN/NOTIFY/pub-sub first. Steps persist
#     to runs.steps, so runs stay crash-viewable, but the live tail does not survive.
#   - The rate limiter is already PostgresRateLimitStore (D-19-5, multi-instance-safe).
#   - The routing latency tracker re-warms per-Machine (~5 turns, self-healing) —
#     degraded-but-tolerable, not blocking.
#   - The file-tool sandbox (PERSONA_TOOLS_SANDBOX_ROOT) is still volume-local
#     (R5-D-4 deferred). Multi-instance file-tool state needs its own pass.
# Enabling N-instance is a deploy decision AFTER the event-bus item is addressed;
# set the three env backends above to their shared-store values at that time.

app = "open-persona-api"                # rename: `flyctl apps create <your-name>` first
primary_region = "fra"                  # Frankfurt — near Vercel `fra1` (D-11-2)
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"
  # fly.toml lives next to the Dockerfile (packages/api/), so the dockerfile
  # path is just "Dockerfile" (relative to fly.toml's directory). The Dockerfile
  # itself uses ``COPY packages/<member>/...`` paths that assume the repo root
  # as the build context — invoke flyctl from the repo root
  # (``flyctl deploy -c packages/api/fly.toml`` or via the Deploy workflow's
  # ``$WORKSPACE/packages/api/fly.toml`` absolute path) so the daemon receives
  # the full workspace tree.

[deploy]
  # Auto-migrate on every deploy: release_command runs `alembic upgrade head` +
  # the persona_app grants (packages/api/release.py) in a temp VM BEFORE the new
  # version is promoted; a non-zero exit ABORTS the deploy, so code never ships
  # against an un-migrated DB. This is a once-per-deploy step (NOT on container
  # start — Spec 07 §7's concern), replacing the easy-to-forget manual §4b step
  # that 500'd every conversation page when `messages.originated` was missing.
  release_command = "python packages/api/release.py"
  strategy = "rolling"

[env]
  PERSONA_LOG_LEVEL = "INFO"
  PERSONA_API_JWT_ALGORITHMS = "RS256"
  PERSONA_API_JWT_AUDIENCE = "persona-api"
  # persona-voice base URL. UNSET in prod until 2026-07-31, and the default is
  # "" — which is the `not_configured` branch of routes/voice.py::
  # _voice_service_base, so EVERY voice call 503'd with
  # {"error":"voice_unavailable","reason":"not_configured"}. It also silently
  # disabled the persona voice auto-pick (voice_assignment_service returns early
  # on an empty base_url), so new personas never got a voice assigned.
  # PUBLIC https, not the Fly 6PN `.internal` address: DNS resolves
  # open-persona-voice.internal to its fdaa:… 6PN IPv6, but connecting to
  # :8001 there fails (ConnectError) because the voice process binds 0.0.0.0
  # (IPv4-only) and so never accepts on the IPv6 private network. Revisit the
  # internal address only if voice is changed to bind [::]. The api reaches
  # voice server-to-server here (routes/voice.py proxies, forwarding the
  # caller's own bearer which voice re-verifies) — this URL is never handed to
  # the browser, so the public hop costs a round trip, not correctness.
  PERSONA_VOICE_SERVICE_URL = "https://voice.openpersonasai.com"
  # JSONL audit + turnlog roots; written to the mounted volume below.
  # PERSONA_API_ prefix — APIConfig.audit_root field reads via Pydantic Settings
  # with env_prefix="PERSONA_API_" (config.py:52). Surfaced at launch when the
  # PERSONA_AUDIT_ROOT typo defaulted audit_root to "./.persona_audit" and the
  # non-root container user got Permission denied on every persona create.
  PERSONA_API_AUDIT_ROOT = "/var/lib/persona/audit"
  PERSONA_TURNLOG_PATH = "/var/lib/persona/turnlogs"
  # workspace_root — Spec 13 image uploads + Spec 14 documents + Spec 15
  # generated images + Spec 16/17 produced files all land under this tree
  # (`<workspace_root>/<owner_id>/<persona_id>/...`). Default falls back to
  # `./.persona_work` (Path.cwd-relative), which on the deployed image
  # resolves to `/app/.persona_work` — owned by root, NOT writable by the
  # non-root persona user → PermissionError on lifespan startup. Same
  # surface as PERSONA_API_AUDIT_ROOT above; co-located on the mounted
  # volume so the bytes persist across deploys (D-15-X-workspace-coordination).
  # First surfaced 2026-06-07 after the F3/F4 deploy that introduced the
  # lifespan mkdir for image / document / produced-file storage.
  PERSONA_API_WORKSPACE_ROOT = "/var/lib/persona/workspace"
  # tools_sandbox_root — Spec 03 file_read / file_write tools (D-03-23) and
  # the code_execution sandbox (spec 12) use this as the workspace root for
  # tool I/O. Distinct from PERSONA_API_WORKSPACE_ROOT (which is the API's
  # image / document / produced-file store) — different module, different
  # Pydantic Settings instance, different env prefix (PERSONA_ vs
  # PERSONA_API_). Defaults to `./.persona_work` which on the deployed
  # image resolves to `/app/.persona_work` (root-owned, non-writable) →
  # PermissionError when the persona invokes file_write. Co-located on the
  # same mounted volume as the API workspace so produced files persist
  # across deploys.
  PERSONA_TOOLS_SANDBOX_ROOT = "/var/lib/persona/tools"
  # HF model cache → the persistent volume (R9-027). The default cache
  # (~/.cache/huggingface) lives in the CONTAINER LAYER, so a machine
  # REPLACEMENT (not just a redeploy) re-downloads the full model set — the
  # bge-small memory embedder + the v1.1.0 crisis-detection MiniLM (~2 GB
  # with tokenizers/configs) — from huggingface.co on boot. Slow at best;
  # during an HF outage it turns a routine machine replacement into a
  # degraded boot (the 2026-07-11 incident class). Which var does what,
  # verified against the installed libs (huggingface_hub 0.36.x,
  # sentence-transformers 3.4.x):
  #   - HF_HOME is the cache BASE huggingface_hub honors (hub cache =
  #     $HF_HOME/hub; HF_HUB_CACHE would override just the hub subdir —
  #     unnecessary once HF_HOME points at the volume).
  #   - sentence-transformers honors SENTENCE_TRANSFORMERS_HOME but, when it
  #     is UNSET, resolves models through the huggingface_hub cache above —
  #     so HF_HOME alone covers BOTH libraries. SENTENCE_TRANSFORMERS_HOME is
  #     deliberately NOT set: setting it would fork a second cache tree.
  # First deploy after this change downloads once INTO the volume; every
  # machine replacement after that reuses the cached weights without touching
  # huggingface.co.
  HF_HOME = "/var/lib/persona/hf"
  # Spec N7 (D-N7-5 / N2-D-1): the writable, reader-visible location of the
  # auto-synced Docker catalog mirror. Bundled package-data mirror.json is
  # root-owned /app/... (baked in, lost on every redeploy) — this path on the
  # already-mounted persona_audit volume below is where the sync writes
  # instead, so the auto-refresh actually PERSISTS machine-to-machine.
  # Unset (dev/local) falls back to the bundled snapshot (config.py's
  # documented override → bundled → catalog.toml precedence).
  PERSONA_MCP_MIRROR_PATH = "/var/lib/persona/mcp-mirror"
  # R9-041-adjacent rider (S2-D-1): the SAME mechanism, same volume, for the
  # external skill mirror — co-located here rather than left unset so a skill
  # mirror sync (once enabled) persists too, instead of silently writing to
  # the bundled/ephemeral path.
  PERSONA_SKILL_MIRROR_PATH = "/var/lib/persona/skill-mirror"

  # -- Spec N7 (D-N7-4/§4.3) — MCP mechanism recipes, commented, operator opt-in --
  #
  # Docker MCP Gateway (Spec N1): connect-only, Persona never spawns the
  # gateway itself — run it yourself (`docker mcp gateway run --transport
  # streaming`, exposing the /mcp streamable-HTTP endpoint), then point Persona
  # at it. The token is a Fly SECRET, never a plaintext [env] value:
  #   flyctl secrets set -c packages/api/fly.toml DOCKER_MCP_GATEWAY_TOKEN=<token>
  # DOCKER_MCP_GATEWAY_URL = "https://your-gateway-host/mcp"
  # (DOCKER_MCP_GATEWAY_TOKEN set as a Fly secret, above — optional for a
  # loopback gateway, required for a non-loopback one, D-N1-5)
  #
  # Per-tenant image-MCP runtime (Spec N6, N6-D-1/3/5): a Fly Machine per
  # (tenant, server), cloud edition only, operator ack required. PREREQUISITE:
  # the runtime Fly app does NOT exist yet in this repo's tooling (no fly.toml,
  # no CI deploy job) — provision it FIRST:
  #   flyctl apps create <your-mcp-runtime-app-name>
  #   flyctl tokens create deploy -a <your-mcp-runtime-app-name>   # scope to that app
  # then set (all as Fly secrets on THIS api app, never plaintext):
  #   flyctl secrets set -c packages/api/fly.toml \
  #     PERSONA_MCP_RUNTIME_FLY_APP=<your-mcp-runtime-app-name> \
  #     FLY_API_TOKEN=<the scoped deploy token>
  # plus the explicit operator ack + vetted allow-list (plain [env] — no
  # secret value, but left commented until actually opted in):
  # PERSONA_ALLOW_PER_TENANT_MCP = "1"
  # PERSONA_MCP_RUN_VETTED = "google-flights"

[mounts]
  source = "persona_audit"
  destination = "/var/lib/persona"

[http_service]
  internal_port = 8000
  force_https = true
  # CRITICAL: single Machine. Don't autoscale (in-memory state) or autostop
  # (cold-start adds 10+s to first request; SSE clients won't recover).
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

[[http_service.checks]]
  # Liveness only — DB-free (couples machine health to process, NOT DB
  # reachability). The deep /healthz readiness check (DB SELECT 1) stays
  # available for monitoring; it's just not the machine liveness gate.
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  path = "/livez"
  timeout = "5s"

[[vm]]
  # bge-small-en-v1.5 (~150 MB) + the crisis-detection encoder's multilingual
  # MiniLM (v1.1.0, R1 safety gate) + FastAPI/Python + chat working set no longer
  # fit in 1 GB — prod OOM-killed on 2026-07-11 (the "bump if OOM surfaces" case).
  # 2 GB matches the live `fly scale memory 2048` applied that day.
  size = "shared-cpu-1x"
  memory = "2048mb"
